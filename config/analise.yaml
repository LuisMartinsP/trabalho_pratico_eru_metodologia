# Parâmetros da análise (etapas 2 a 7). Ficam registrados no manifesto de cada
# tabela gerada; se mudarem, as etapas seguintes avisam que é preciso rodar de novo.
# Ver docs/decisoes_metodologicas.md, seção 12.

# Fontes analisadas quando os scripts rodam sem argumentos.
# "referencia" = soluções de referência do Exercism (linha de base humana);
# os modelos usam o nome da pasta em dados/ (o nome do modelo na API).
fontes:
  - referencia
  - gpt-5-mini
  - gemini-2.5-flash

paradigma:
  regra_oficial: d    # d = pontos por operação (src/paradigma_operacoes.py); c = por comando (src/paradigma_adaptado.py)
  min_pontos: 3       # com menos pontos funcionais + procedurais, o rótulo vira "indeterminado"

smells:
  excluir_herdados_do_esqueleto: true   # a análise principal usa só os avisos próprios da solução
  # Avisos de estilo ignorados na análise principal, seguindo Siddiq et al. (SCAM 2022): espaço em
  # branco, quebra de linha final e nomes. Continuam registrados em avisos.csv e entram numa análise
  # de sensibilidade. Decisão registrada em docs/decisoes_metodologicas.md, seção 13.
  simbolos_ignorados:
    - trailing-whitespace
    - missing-final-newline
    - trailing-newlines
    - invalid-name

validacao:
  semente: 2026        # sorteio da amostra (reprodutível)
  por_estrato: 6       # soluções sorteadas por fonte × rótulo
  casos_dificeis: 10   # estrato extra, reportado à parte
